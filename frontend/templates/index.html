<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>siji-DNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;
  --bg2:#0e1117;
  --bg3:#141820;
  --bg4:#1c2130;
  --bg5:#242b3d;
  --border:#1e2538;
  --border2:#2a3350;
  --text:#e8eaf2;
  --text2:#8b93b0;
  --text3:#505878;
  --accent:#4f8ef7;
  --accent2:#3b7af0;
  --accent3:#1a3a8f;
  --green:#34c97a;
  --red:#f25656;
  --orange:#f0a035;
  --purple:#a78bfa;
  --cyan:#22d3ee;
  --font:'Plus Jakarta Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:6px;--r2:10px;--r3:16px;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}

/* ── Login ── */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999}
#login-screen.hidden{display:none}
.login-wrap{width:100%;max-width:380px;padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);padding:36px 32px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.login-mark{width:40px;height:40px;background:var(--accent2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;letter-spacing:-1px;flex-shrink:0}
.login-brand{font-size:20px;font-weight:700;color:var(--text)}
.login-brand span{color:var(--accent)}
.login-sub{font-size:12px;color:var(--text3);margin-top:2px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--text3);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase}
.login-field input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 14px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.login-field input:focus{border-color:var(--accent)}
.login-field input::placeholder{color:var(--text3)}
.login-btn{width:100%;background:var(--accent2);border:none;border-radius:var(--r2);padding:11px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;font-family:var(--font);transition:background .15s;margin-top:4px}
.login-btn:hover{background:#4f8ef7}
.login-hint{text-align:center;font-size:12px;color:var(--text3);margin-top:14px}
.login-hint code{background:var(--bg4);padding:1px 6px;border-radius:4px;font-family:var(--mono)}

/* ── Shell ── */
#app{display:flex;height:100vh;overflow:hidden}
#app.hidden{display:none}

/* ── Sidebar ── */
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s}
.sidebar.collapsed{width:56px;min-width:56px}
.sb-head{padding:16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sb-mark{width:28px;height:28px;background:var(--accent2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.sb-brand{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;color:var(--text)}
.sb-brand span{color:var(--accent)}
.sb-ver{font-size:10px;color:var(--text3);white-space:nowrap}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-section{padding:14px 14px 4px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 12px;margin:1px 6px;border-radius:var(--r2);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .12s;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--bg4);color:var(--text)}
.nav-item.active{background:var(--accent3);color:#a8c8ff}
.nav-item svg{width:15px;height:15px;flex-shrink:0}
.nav-lbl{white-space:nowrap;overflow:hidden}
.sb-foot{padding:10px;border-top:1px solid var(--border)}
.sb-status{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3);border-radius:var(--r2)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--green)}
.dot-r{background:var(--red)}
.dot-o{background:var(--orange)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dot-live{animation:blink 2s infinite}
.sb-status-txt{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;flex:1}
.sb-logout{padding:4px 8px;background:transparent;border:1px solid var(--border2);border-radius:var(--r);color:var(--text3);font-size:11px;cursor:pointer;font-family:var(--font);white-space:nowrap}
.sb-logout:hover{color:var(--red);border-color:var(--red)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topbar-toggle{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:var(--r);display:flex;align-items:center}
.topbar-toggle:hover{background:var(--bg4);color:var(--text)}
.topbar-title{font-size:14px;font-weight:600;flex:1;color:var(--text)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:20px}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px}
.card+.card{margin-top:14px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--text)}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:14px}
.stat-lbl{font-size:11px;color:var(--text3);margin-bottom:5px;font-weight:500}
.stat-val{font-size:24px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r2);font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .12s;font-family:var(--font);white-space:nowrap}
.btn-primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-primary:hover{background:#4f8ef7}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border2)}
.btn-ghost:hover{background:var(--bg4);color:var(--text)}
.btn-danger{background:transparent;color:var(--red);border-color:rgba(242,86,86,.3)}
.btn-danger:hover{background:rgba(242,86,86,.08)}
.btn-success{background:transparent;color:var(--green);border-color:rgba(52,201,122,.3)}
.btn-success:hover{background:rgba(52,201,122,.08)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn svg{width:13px;height:13px}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-blue{background:rgba(79,142,247,.12);color:#7fb3ff;border:1px solid rgba(79,142,247,.2)}
.badge-green{background:rgba(52,201,122,.12);color:#5ddc8f;border:1px solid rgba(52,201,122,.2)}
.badge-red{background:rgba(242,86,86,.12);color:#ff8a8a;border:1px solid rgba(242,86,86,.2)}
.badge-orange{background:rgba(240,160,53,.12);color:#ffc06b;border:1px solid rgba(240,160,53,.2)}
.badge-purple{background:rgba(167,139,250,.12);color:#c4b0ff;border:1px solid rgba(167,139,250,.2)}
.badge-gray{background:var(--bg4);color:var(--text2);border:1px solid var(--border2)}

/* ── Forms ── */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
.fi,.fs,.ft{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:8px 12px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--accent)}
.fi::placeholder,.ft::placeholder{color:var(--text3)}
.fs option{background:var(--bg3)}
.ft{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── Toggle ── */
.tog{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-sl{position:absolute;inset:0;background:var(--bg5);border-radius:10px;cursor:pointer;transition:.2s;border:1px solid var(--border2)}
.tog-sl::after{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:.2s}
.tog input:checked+.tog-sl{background:var(--accent2);border-color:var(--accent2)}
.tog input:checked+.tog-sl::after{transform:translateX(16px);background:#fff}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 12px;font-size:10px;font-weight:700;color:var(--text3);border-bottom:1px solid var(--border);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
td{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02);color:var(--text)}
.mono{font-family:var(--mono);font-size:11px}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;gap:0;overflow-x:auto}
.tab{padding:8px 14px;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Alert ── */
.alert{padding:10px 14px;border-radius:var(--r2);font-size:12px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert-info{background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.2);color:#7fb3ff}
.alert-success{background:rgba(52,201,122,.08);border:1px solid rgba(52,201,122,.2);color:#5ddc8f}
.alert-error{background:rgba(242,86,86,.08);border:1px solid rgba(242,86,86,.2);color:#ff8a8a}
.alert-warn{background:rgba(240,160,53,.08);border:1px solid rgba(240,160,53,.2);color:#ffc06b}

/* ── Code ── */
.code{font-family:var(--mono);font-size:11px;background:var(--bg4);padding:2px 6px;border-radius:4px;color:var(--cyan)}
.codeblock{font-family:var(--mono);font-size:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 14px;overflow-x:auto;color:var(--text2);line-height:1.7;white-space:pre}

/* ── Record type badges ── */
.rt{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.rt-A{background:rgba(52,201,122,.15);color:#5ddc8f}
.rt-AAAA{background:rgba(52,201,122,.1);color:#34c97a}
.rt-CNAME{background:rgba(79,142,247,.15);color:#7fb3ff}
.rt-MX{background:rgba(167,139,250,.15);color:#c4b0ff}
.rt-TXT{background:rgba(240,160,53,.15);color:#ffc06b}
.rt-NS{background:rgba(34,211,238,.15);color:#67e8f9}
.rt-PTR{background:rgba(242,86,86,.15);color:#ff8a8a}
.rt-SRV,.rt-CAA{background:var(--bg5);color:var(--text2)}

/* ── Modal ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);width:460px;max-width:100%;max-height:85vh;overflow-y:auto}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:14px;font-weight:600}
.modal-body{padding:20px}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ── Toast ── */
#toasts{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 14px;font-size:12px;max-width:300px;pointer-events:all}
.toast-s{border-left:3px solid var(--green)}
.toast-e{border-left:3px solid var(--red)}
.toast-i{border-left:3px solid var(--accent)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.toast{animation:tin .2s ease}

/* ── Spinner ── */
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:rot .5s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── Bar chart ── */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-lbl{width:110px;font-size:11px;color:var(--text3);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:6px;background:var(--bg5);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--accent2);transition:width .4s}
.bar-val{width:40px;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}

/* ── Service row ── */
.svc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg3);border-radius:var(--r2);margin-bottom:7px}
.svc-name{font-size:12px;font-weight:500}
.svc-sub{font-size:11px;color:var(--text3)}

/* ── Grid helpers ── */
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hidden{display:none!important}

/* ── Responsive ── */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;height:100%;z-index:200;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .main{width:100%}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .content{padding:14px}
  .modal{width:100%;max-width:100%}
}
@media(max-width:480px){
  .stats-row{grid-template-columns:1fr 1fr}
  .topbar{padding:0 14px}
}

/* ── Overlay for mobile sidebar ── */
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199}
#sb-overlay.show{display:block}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-mark">S1</div>
        <div>
          <div class="login-brand">siji<span>-DNS</span></div>
          <div class="login-sub">DNS Management Platform</div>
        </div>
      </div>
      <div class="login-field">
        <label>Username</label>
        <input type="text" id="lu" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Masukkan username">
      </div>
      <div class="login-field">
        <label>Password</label>
        <input type="password" id="lp" autocomplete="new-password" placeholder="Masukkan password">
      </div>
      <button class="login-btn" id="login-btn" onclick="doLogin()">
        <span id="login-spin" class="spin hidden"></span>
        Masuk ke Dashboard
      </button>
      <div class="login-hint">Default: <code>admin</code> / <code>siji-admin</code></div>
    </div>
  </div>
</div>

<div id="sb-overlay" onclick="closeMobileSidebar()"></div>

<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-mark">S1</div>
      <div style="overflow:hidden">
        <div class="sb-brand">siji<span>-DNS</span></div>
        <div class="sb-ver">v1.0 · ISP Edition</div>
      </div>
    </div>

        <span class="nav-lbl">Dashboard</span>
      </div>
      <div class="nav-item" data-page="querylog" onclick="goPage('querylog')">

        <span class="nav-lbl">DNS Zones</span>
      </div>

      <div class="sb-section">Resolver</div>
      <div class="nav-item" data-page="forwarding" onclick="goPage('forwarding')">
        <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M1 11.5a.5.5 0 0 0 .5.5h11.793l-3.147 3.146a.5.5 0 0 0 .708.708l4-4a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 11H1.5a.5.5 0 0 0-.5.5zm14-7a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 1 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H14.5a.5.5 0 0 1 .5.5z"/></svg>
        <span class="nav-lbl">Forwarding</span>

      <div class="sb-section">Keamanan</div>
      <div class="nav-item" data-page="filtering" onclick="goPage('filtering')">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5v-2z"/></svg>
        <span class="nav-lbl">Filtering</span>
      </div>
      <div class="nav-item" data-page="dnssec" onclick="goPage('dnssec')">

<script>
const API = window.location.origin + '/api';
let TOKEN = localStorage.getItem('siji_token');
let isMobile = () => window.innerWidth <= 768;

function toast(msg, type='i') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

async function req(method, path, body) {
  const opts = {method, headers: {'Content-Type': 'application/json'}};
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(API + path, opts);
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin(); return null; }
    if (!r.ok) { toast(d.error || 'Terjadi kesalahan', 'e'); return null; }
    return d;
  } catch(e) { toast('Koneksi gagal', 'e'); return null; }
}

async function doLogin() {
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  if (!u || !p) { toast('Isi username dan password', 'e'); return; }
  const btn = document.getElementById('login-btn');
  const sp = document.getElementById('login-spin');
  btn.disabled = true; sp.classList.remove('hidden');
  try {
    const r = await fetch(API + '/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p})
    });
    if (r.ok) {
      const d = await r.json();
      TOKEN = d.token;
      localStorage.setItem('siji_token', TOKEN);
      showApp();
    } else {
      toast('Username atau password salah', 'e');
    }
  } finally { btn.disabled = false; sp.classList.add('hidden'); }
}

function doLogout() {
  TOKEN = null;
  localStorage.removeItem('siji_token');
  showLogin();
}

function showLogin() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('lu').value = '';
  document.getElementById('lp').value = '';
}

function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  goPage('dashboard');
  checkStatus();
  setInterval(checkStatus, 20000);
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sb-overlay');
  if (isMobile()) {
    sb.classList.toggle('open');
    ov.classList.toggle('show', sb.classList.contains('open'));
  } else {
    sb.classList.toggle('collapsed');
  }
}

function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('show');
}

async function checkStatus() {
  const r = await req('GET', '/zones/status');
  const dot = document.getElementById('bind-dot');
  const txt = document.getElementById('bind-txt');
  if (r && r.status === 'active') {
    dot.className = 'dot dot-g dot-live';
    txt.textContent = 'BIND9 aktif';
  } else {
    dot.className = 'dot dot-r';
    txt.textContent = 'BIND9 mati';
  }
}

const PAGES = {
  dashboard:'Dashboard', zones:'DNS Zones', querylog:'Query Log',
  forwarding:'Forwarding', filtering:'Filtering & Blocklist',
  dnssec:'DNSSEC', transport:'DoH / DoT / DoQ', settings:'Pengaturan'
};

function goPage(page) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('page-title').textContent = PAGES[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('content').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:200px"><div class="spin" style="width:20px;height:20px;border-width:2px"></div></div>';
  if (isMobile()) closeMobileSidebar();
  const handlers = {dashboard:pgDashboard,zones:pgZones,querylog:pgQueryLog,forwarding:pgForwarding,filtering:pgFiltering,dnssec:pgDNSSEC,transport:pgTransport,settings:pgSettings};
  if (handlers[page]) handlers[page]();
}

function set(html) { document.getElementById('content').innerHTML = html; }
function actions(html) { document.getElementById('topbar-actions').innerHTML = html; }

async function pgDashboard() {

    <div class="bar-row">

      <div class="stat"><div class="stat-lbl">Zones Aktif</div><div class="stat-val">${stats.zones||0}</div><div class="stat-sub">${stats.records||0} records</div></div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-hd"><span class="card-title">Query 24 Jam</span><span class="badge badge-blue">Live</span></div>
        ${tlSvg}
        <div style="display:flex;gap:14px;margin-top:8px">

        </div>
      </div>

        <div class="card-hd"><span class="card-title">Top Domain (1 Jam)</span></div>

    </div>
    <div class="grid-2" style="margin-top:14px">
      <div class="card">
        <div class="card-hd"><span class="card-title">Status Layanan</span></div>
        <div class="svc-row"><div><div class="svc-name">BIND9 Authoritative</div><div class="svc-sub">Port 53 · zone management</div></div><span class="badge badge-green"><span class="dot dot-g" style="width:6px;height:6px"></span>Aktif</span></div>

        <div class="svc-row" style="margin-bottom:0"><div><div class="svc-name">dnsdist</div><div class="svc-sub">DoH / DoT / DoQ proxy</div></div><span class="badge badge-gray">Nonaktif</span></div>
      </div>

        <div class="card-hd"><span class="card-title">Aksi Cepat</span></div>

          <button class="btn btn-ghost" style="justify-content:flex-start" onclick="goPage('zones')"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg> Tambah Zone Baru</button>
          <button class="btn btn-ghost" style="justify-content:flex-start" onclick="goPage('filtering')"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg> Refresh Blocklist</button>

function buildTimeline(data) {
  if (!data.length) return '<div style="height:120px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3)">Belum ada data</div>';
  const max = Math.max(...data.map(d=>d.total),1);
  const w=560,h=120,pad=8,bw=Math.max(2,(w-pad*2)/data.length-1);
  const bars=data.map((d,i)=>{
    const x=pad+i*((w-pad*2)/data.length);
    const bh=Math.max(2,(d.total/max)*(h-pad*2));
    const bh2=Math.max(1,((d.blocked||0)/max)*(h-pad*2));
    return `<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" fill="rgba(59,122,240,.5)" rx="1"/><rect x="${x}" y="${h-bh2}" width="${bw}" height="${bh2}" fill="rgba(242,86,86,.6)" rx="1"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:120px;display:block"><line x1="${pad}" y1="${h}" x2="${w-pad}" y2="${h}" stroke="var(--border)" stroke-width="0.5"/>${bars}</svg>`;
}

async function pgZones() {

      <button class="btn btn-ghost btn-sm" onclick="pgRecords(${z.id},'${z.name}')">Records</button>
      <button class="btn btn-danger btn-sm" onclick="delZone(${z.id},'${z.name}')">Hapus</button>

function modalAddFwd(){modal('Tambah Forwarder',`
  <div class="fg"><label>Nama</label><input class="fi" id="f-name" placeholder="Upstream ISP" autocomplete="off"></div>
  <div class="form-row">
    <div class="fg"><label>IP Address</label><input class="fi" id="f-ip" placeholder="8.8.8.8" autocomplete="off"></div>

    <div class="fg"><label>Prioritas</label><input class="fi" id="f-prio" type="number" value="10"></div>

async function pgDNSSEC(){
  const[zones,status]=await Promise.all([req('GET','/zones/'),req('GET','/dnssec/status')]);
  if(!zones)return;
  const rows=zones.map(z=>`<tr>
    <td class="mono">${z.name}</td>
    <td><span class="badge ${z.dnssec?'badge-green':'badge-gray'}">${z.dnssec?'Aktif':'Off'}</span></td>

      ${z.dnssec
        ?`<button class="btn btn-ghost btn-sm" onclick="signZone(${z.id},'${z.name}')">Sign</button><button class="btn btn-ghost btn-sm" onclick="viewDS(${z.id},'${z.name}')">DS Records</button>`
        :`<button class="btn btn-primary btn-sm" onclick="genKeys(${z.id},'${z.name}')">Generate Keys</button>`}
    </div></td>
  </tr>`).join('');
  set(`

async function loadQL(){
  const s=document.getElementById('ql-s')?.value||'',t=document.getElementById('ql-t')?.value||'',b=document.getElementById('ql-b')?.value||'';
  let url='/stats/query-log?limit=50&page=1';
  if(s)url+=`&search=${encodeURIComponent(s)}`;
  if(t)url+=`&type=${t}`;
  if(b)url+=`&blocked=${b}`;
  const r=await req('GET',url);
  if(!r)return;
  const rows=r.rows.map(q=>`<tr>
    <td style="color:var(--text3);font-size:10px">${new Date(q.timestamp).toLocaleTimeString('id')}</td>
    <td class="mono">${q.client_ip||'—'}</td>
    <td class="mono">${q.query_name}</td>
    <td><span class="rt rt-${q.query_type||'A'}">${q.query_type||'?'}</span></td>
    <td>${q.blocked?'<span class="badge badge-red">Blocked</span>':'<span class="badge badge-green">OK</span>'}</td>
    <td style="color:var(--text3);font-size:11px">${q.latency_ms?q.latency_ms+'ms':'—'}</td>
    <td><span class="badge badge-gray">${q.protocol||'udp'}</span></td>
  </tr>`).join('');
  document.getElementById('ql-table').innerHTML=`
    <div style="font-size:11px;color:var(--text3);margin-bottom:8px">${r.total.toLocaleString()} total query</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Waktu</th><th>Client IP</th><th>Domain</th><th>Tipe</th><th>Status</th><th>Latency</th><th>Protokol</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text3)">Belum ada log</td></tr>'}</tbody>
    </table></div>`;
}

        ${onSave?`<div class="modal-ft"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Batal</button><button class="btn btn-primary btn-sm" onclick="(${onSave.toString()})()">Simpan</button></div>`:`<div class="modal-ft"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Tutup</button></div>`}
      </div>
    </div>`;}

function closeModal(){document.getElementById('modal-wrap').innerHTML='';}

document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('lu').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lp').focus();});

if(TOKEN){showApp();}else{showLogin();}
</script>
</body>
</html>
